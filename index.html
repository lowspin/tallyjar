<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tallyjar</title>
    <meta name="description" content="A calm, friendly way to count things." />
    <meta name="theme-color" content="#FDFAF4" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tallyjar" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      ;(function () {
        try {
          var pref = localStorage.getItem('tallyjar-theme') || 'system'
          var dark =
            pref === 'dark' ||
            (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#0F171C' : '#FDFAF4')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
